<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منصة الاختبارات والتقويم الاحترافية</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    // إعدادات Tailwind للوضع الداكن والألوان
    tailwind.config = { 
        darkMode: 'class',
        theme: {
            extend: {
                colors: {
                    primary: '#2563EB',
                    primaryDark: '#1E40AF',
                    secondary: '#334155',
                    success: '#10B981',
                    warning: '#F59E0B',
                    danger: '#EF4444',
                    backgroundLight: '#F8FAFC',
                    backgroundDark: '#0F172A',
                },
                fontFamily: {
                    sans: ['"Cairo"', '"Plus Jakarta Sans"', 'sans-serif'],
                }
            }
        }
    };
    
    // إعدادات MathJax لكتابة المعادلات الرياضية
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  
  <style>
    body { 
        font-family: 'Cairo', sans-serif; 
        color: #1E293B;
        background: linear-gradient(135deg, #F0F9FF 0%, #E0E7FF 100%);
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
    }
    .dark body {
        color: #F8FAFC;
        background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%);
    }

    .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08);
    }
    .dark .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5);
    }

    .glass-input {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(226, 232, 240, 0.8);
        transition: all 0.3s ease;
        color: #1E293B;
    }
    .dark .glass-input {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(51, 65, 85, 0.8);
        color: #F8FAFC;
    }
    .glass-input:focus {
        border-color: #2563EB;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        outline: none;
    }
    .dark .glass-input:focus {
        border-color: #3B82F6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
    }

    .glass-btn-primary {
        background: linear-gradient(135deg, #2563EB, #1D4ED8);
        color: white;
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        transition: all 0.3s ease;
    }
    .glass-btn-primary:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
    }
    .glass-btn-primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .glass-card-hover { transition: all 0.3s ease; }
    .glass-card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.1);
    }
    .dark .glass-card-hover:hover { box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4); }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 10px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeInUp 0.4s ease-out forwards; }
    
    /* Fullscreen specific styles */
    :fullscreen { background: #F8FAFC; overflow-y: auto; }
    ::backdrop { background: #F8FAFC; }
    .dark:fullscreen { background: #0F172A; }
    .dark::backdrop { background: #0F172A; }

  </style>
</head>
<body class="transition-colors duration-300">
  <div id="root"></div>

  <!-- React & Libraries -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const { useState, useEffect, useRef } = React;
    const { createRoot } = ReactDOM;

    // --- Firebase Configuration ---
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyCZ5uCdQCv3DFIfVaOnl1JgZ5VMP8nfnIQ",
      authDomain: "anes-4dc4d.firebaseapp.com",
      projectId: "anes-4dc4d",
      storageBucket: "anes-4dc4d.firebasestorage.app",
      messagingSenderId: "542884354403",
      appId: "1:542884354403:web:25a796fa8ec47ae69cdb56"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    
    // إشعار هام: لحل مشكلة الصلاحيات Missing or insufficient permissions
    // يجب الاعتماد على __app_id الموجود في بيئة التطبيق بدلاً من projectId
    const targetAppId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    
    // Strict Database Paths
    const getColRef = (name) => collection(db, 'artifacts', targetAppId, 'public', 'data', name);
    const getDocRef = (name, id) => doc(db, 'artifacts', targetAppId, 'public', 'data', name, id);

    const DEFAULT_ADMIN = {
        id: 'admin_001',
        username: 'admin',
        password: 'admin',
        role: 'teacher'
    };

    // --- Utility Components ---
    const MathComponent = ({ text }) => {
      const ref = useRef(null);
      useEffect(() => {
        if (window.MathJax && ref.current) {
          window.MathJax.typesetPromise([ref.current]).catch(err => console.log(err));
        }
      }, [text]);
      return <span ref={ref} dir="auto" className="break-words">{text}</span>;
    };

    const SettingsDropdown = ({ setDarkMode, darkMode, handleLogout }) => {
        const [isOpen, setIsOpen] = useState(false);
        const dropdownRef = useRef(null);

        useEffect(() => {
            const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setIsOpen(false); };
            document.addEventListener("mousedown", handleClickOutside);
            return () => document.removeEventListener("mousedown", handleClickOutside);
        }, []);

        return (
            <div className="relative" ref={dropdownRef}>
                <button onClick={() => setIsOpen(!isOpen)} className="p-3 rounded-xl glass-panel hover:bg-slate-100 dark:hover:bg-slate-800 transition shadow-sm text-lg flex items-center justify-center">
                    ⚙️
                </button>
                {isOpen && (
                    <div className="absolute z-[9999] top-full mt-2 left-0 w-48 glass-panel rounded-xl overflow-hidden shadow-2xl border border-slate-200 dark:border-slate-700">
                        <button onClick={() => { setDarkMode(!darkMode); setIsOpen(false); }} className="w-full text-right px-4 py-3 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-semibold transition border-b border-slate-200 dark:border-slate-700">
                            {darkMode ? '☀️ الوضع الفاتح' : '🌙 الوضع الداكن'}
                        </button>
                        <button onClick={() => { handleLogout(); setIsOpen(false); }} className="w-full text-right px-4 py-3 text-danger hover:bg-red-50 dark:hover:bg-red-900/20 text-sm font-bold transition">
                            🚪 تسجيل الخروج
                        </button>
                    </div>
                )}
            </div>
        );
    };

    // --- Main App ---
    function App() {
        // --- State ---
        const [users, setUsers] = useState([]);
        const [tests, setTests] = useState([]);
        const [categories, setCategories] = useState([]);
        const [levels, setLevels] = useState([]);
        
        const [dbReady, setDbReady] = useState(false);
        const [authUser, setAuthUser] = useState(null);

        const [currentPage, setCurrentPage] = useState('login'); // login, register, profileSetup, dashboard, test, results
        const [currentUser, setCurrentUser] = useState(null);
        const [devPage, setDevPage] = useState('dashboard'); // dashboard, users, settings
        
        const [darkMode, setDarkMode] = useState(false);

        // Auth Form
        const [authUsername, setAuthUsername] = useState('');
        const [authPassword, setAuthPassword] = useState('');
        const [authError, setAuthError] = useState('');
        
        // Profile Setup (Student First Login)
        const [setupCategory, setSetupCategory] = useState('');
        const [setupLevel, setSetupLevel] = useState('');

        // Test Creation
        const [showCreateTestForm, setShowCreateTestForm] = useState(false);
        const [editingTestId, setEditingTestId] = useState(null);
        const [newTestTitle, setNewTestTitle] = useState('');
        const [newTestCategory, setNewTestCategory] = useState('');
        const [newTestLevel, setNewTestLevel] = useState('');
        const [newTestDuration, setNewTestDuration] = useState('');
        const [newTestMaxAttempts, setNewTestMaxAttempts] = useState('3');
        const [newTestQuestions, setNewTestQuestions] = useState([]);

        // Category/Level Management
        const [newCategoryName, setNewCategoryName] = useState('');
        const [newLevelName, setNewLevelName] = useState('');
        const [selectedCategoryForLevel, setSelectedCategoryForLevel] = useState('');

        // Active Tabs in Teacher Dash
        const [activeCategoryTab, setActiveCategoryTab] = useState('');

        // Test Runner
        const [selectedTest, setSelectedTest] = useState(null);
        const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
        const [answers, setAnswers] = useState({});
        const [timer, setTimer] = useState(0);
        const [quizSubmitted, setQuizSubmitted] = useState(false);
        const [isExamCancelled, setIsExamCancelled] = useState(false);

        // Dark mode sync
        useEffect(() => {
            document.documentElement.className = darkMode ? 'dark' : '';
        }, [darkMode]);

        // Firebase Init
        useEffect(() => {
            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                } catch(e) { console.error("Auth Error", e); }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, user => setAuthUser(user));
            return () => unsubscribe();
        }, []);

        // Listeners
        useEffect(() => {
            if (!authUser) return;

            const unsubUsers = onSnapshot(getColRef('users'), snap => {
                const data = snap.docs.map(d => d.data());
                if (data.length === 0) setDoc(getDocRef('users', DEFAULT_ADMIN.id), DEFAULT_ADMIN);
                else setUsers(data);
            }, e => console.error(e));

            const unsubTests = onSnapshot(getColRef('tests'), snap => setTests(snap.docs.map(d => d.data())), e => console.error(e));
            const unsubCategories = onSnapshot(getColRef('categories'), snap => {
                const cats = snap.docs.map(d => d.data());
                setCategories(cats);
                if(cats.length > 0 && !activeCategoryTab) setActiveCategoryTab(cats[0].id);
            }, e => console.error(e));
            const unsubLevels = onSnapshot(getColRef('levels'), snap => setLevels(snap.docs.map(d => d.data())), e => console.error(e));
            
            setDbReady(true);
            return () => { unsubUsers(); unsubTests(); unsubCategories(); unsubLevels(); };
        }, [authUser]);

        // Test Timer & Fullscreen Observer
        useEffect(() => {
            let interval = null;
            if (currentPage === 'test' && timer > 0 && !quizSubmitted && !isExamCancelled) {
                interval = setInterval(() => setTimer(t => t - 1), 1000);
            } else if (currentPage === 'test' && timer === 0 && !quizSubmitted && !isExamCancelled) {
                handleSubmitTest(false);
            }
            return () => clearInterval(interval);
        }, [currentPage, timer, quizSubmitted, isExamCancelled]);

        useEffect(() => {
            const handleFullScreenChange = () => {
                if (currentPage === 'test' && !document.fullscreenElement && !quizSubmitted) {
                    setIsExamCancelled(true);
                    handleSubmitTest(true); // cancelled
                }
            };
            document.addEventListener('fullscreenchange', handleFullScreenChange);
            return () => document.removeEventListener('fullscreenchange', handleFullScreenChange);
        }, [currentPage, quizSubmitted]);

        // --- Core Functions ---

        const handleAuth = async (isRegister) => {
            setAuthError('');
            if (!authUsername || !authPassword) return setAuthError('يرجى إدخال اسم المستخدم وكلمة المرور');

            const existingUser = users.find(u => u.username === authUsername);

            if (isRegister) {
                if (existingUser) return setAuthError('اسم المستخدم موجود بالفعل، الرجاء تسجيل الدخول');
                
                const newUser = {
                    id: 'usr_' + Date.now(),
                    username: authUsername,
                    password: authPassword,
                    role: 'student',
                    scores: {},
                    attemptsLeft: {},
                    incorrectQuestions: [],
                    category: '',
                    level: ''
                };
                await setDoc(getDocRef('users', newUser.id), newUser);
                setCurrentUser(newUser);
                setCurrentPage('profileSetup');
            } else {
                if (!existingUser || existingUser.password !== authPassword) {
                    return setAuthError('بيانات الدخول غير صحيحة');
                }
                setCurrentUser(existingUser);
                if (existingUser.role === 'student' && (!existingUser.category || !existingUser.level)) {
                    setCurrentPage('profileSetup');
                } else {
                    setCurrentPage('dashboard');
                }
            }
        };

        const handleProfileSetup = async () => {
            if(!setupCategory || !setupLevel) return alert("يرجى اختيار الفرقة والمستوى");
            const updatedUser = { ...currentUser, category: setupCategory, level: setupLevel };
            await setDoc(getDocRef('users', currentUser.id), updatedUser);
            setCurrentUser(updatedUser);
            setCurrentPage('dashboard');
        };

        const handleLogout = () => {
            if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
            setCurrentUser(null);
            setAuthUsername('');
            setAuthPassword('');
            setCurrentPage('login');
        };

        // Admin: Settings Data
        const addCategory = async () => {
            if(!newCategoryName) return;
            const cat = { id: 'cat_'+Date.now(), name: newCategoryName };
            await setDoc(getDocRef('categories', cat.id), cat);
            setNewCategoryName('');
            if(!activeCategoryTab) setActiveCategoryTab(cat.id);
        };
        const deleteCategory = async (id) => {
            if(window.confirm("حذف التصنيف؟")) await deleteDoc(getDocRef('categories', id));
        };
        const addLevel = async () => {
            if(!newLevelName || !selectedCategoryForLevel) return alert("حدد التصنيف واسم المستوى");
            const lvl = { id: 'lvl_'+Date.now(), name: newLevelName, categoryId: selectedCategoryForLevel };
            await setDoc(getDocRef('levels', lvl.id), lvl);
            setNewLevelName('');
        };
        const deleteLevel = async (id) => {
            if(window.confirm("حذف المستوى؟")) await deleteDoc(getDocRef('levels', id));
        };

        // Admin: Backup & Restore
        const exportJSON = (data, filename) => {
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = filename; a.click();
            URL.revokeObjectURL(url);
        };
        
        const importJSON = (e, collectionName) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                try {
                    const data = JSON.parse(ev.target.result);
                    if(Array.isArray(data)) {
                        for(let item of data) {
                            if(item.id) await setDoc(getDocRef(collectionName, item.id), item);
                        }
                        alert(`تم استيراد ${data.length} عنصر إلى ${collectionName} بنجاح`);
                    }
                } catch(err) { alert("خطأ في قراءة الملف"); }
            };
            reader.readAsText(file);
            e.target.value = ''; // reset
        };

        // Admin: Test Builder
        const createNewQuestion = () => ({
            id: 'q_'+Date.now(), text: '', imageUrl: '', 
            options: [ {id:'a', text:'', imageUrl:''}, {id:'b', text:'', imageUrl:''}, {id:'c', text:'', imageUrl:''}, {id:'d', text:'', imageUrl:''} ],
            correctAnswer: 'a'
        });

        const resetTestForm = () => {
            setEditingTestId(null); setNewTestTitle(''); setNewTestCategory(''); setNewTestLevel('');
            setNewTestDuration(''); setNewTestMaxAttempts('3'); setNewTestQuestions([createNewQuestion()]);
            setShowCreateTestForm(false);
        };

        const saveTest = async () => {
            if(!newTestTitle || !newTestCategory || !newTestLevel || !newTestDuration || newTestQuestions.length===0) 
                return alert("يرجى إكمال جميع حقول الاختبار وإضافة سؤال واحد على الأقل.");
            
            const testObj = {
                id: editingTestId || 'test_' + Date.now(),
                title: newTestTitle,
                categoryId: newTestCategory,
                levelId: newTestLevel,
                duration: parseInt(newTestDuration),
                maxAttempts: parseInt(newTestMaxAttempts),
                questions: newTestQuestions
            };
            await setDoc(getDocRef('tests', testObj.id), testObj);
            resetTestForm();
        };

        const deleteTest = async (id) => {
            if(window.confirm("تأكيد الحذف؟")) await deleteDoc(getDocRef('tests', id));
        };

        // Admin: Users
        const deleteUser = async (id) => {
            if(window.confirm("حذف الطالب نهائياً؟")) await deleteDoc(getDocRef('users', id));
        };
        const resetAttempts = async (user) => {
            if(window.confirm("هل تريد تصفير محاولات هذا الطالب؟ (سيتم استعادة الفرص لجميع الاختبارات)")) {
                await setDoc(getDocRef('users', user.id), { ...user, attemptsLeft: {} });
            }
        };

        // Student: Exam Execution
        const startExam = async (testId) => {
            const test = tests.find(t => t.id === testId);
            if (!test) return;

            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                }
            } catch(e) {
                alert("يجب السماح بوضع الشاشة الكاملة لبدء الاختبار لمنع الغش.");
                return;
            }

            // Shuffle Engine
            let testToRun = JSON.parse(JSON.stringify(test));
            testToRun.questions.sort(() => Math.random() - 0.5); // Shuffle Questions
            testToRun.questions.forEach(q => q.options.sort(() => Math.random() - 0.5)); // Shuffle Options

            setSelectedTest(testToRun);
            setAnswers({});
            setQuizSubmitted(false);
            setIsExamCancelled(false);
            setTimer(test.duration * 60);
            setCurrentPage('test');
            setCurrentQuestionIndex(0);
        };

        const handleSubmitTest = async (cancelled = false) => {
            if (quizSubmitted) return;
            setQuizSubmitted(true);
            
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(()=>{});
            }

            const qs = selectedTest.questions;
            const score = cancelled ? 0 : qs.filter(q => answers[q.id] === q.correctAnswer).length;
            
            const uIndex = users.findIndex(u => u.id === currentUser.id);
            if (uIndex > -1) {
                const userToUpdate = {...users[uIndex]};
                
                // Track attempts
                const left = userToUpdate.attemptsLeft[selectedTest.id] !== undefined ? userToUpdate.attemptsLeft[selectedTest.id] : selectedTest.maxAttempts;
                userToUpdate.attemptsLeft[selectedTest.id] = Math.max(0, left - 1);

                // Track Score
                if (!userToUpdate.scores[selectedTest.id]) userToUpdate.scores[selectedTest.id] = [];
                userToUpdate.scores[selectedTest.id].push({
                    score, total: qs.length, date: new Date().toLocaleDateString('ar-SA'), cancelled
                });

                // Track Weak Points (Incorrect Questions)
                if (!cancelled) {
                    const incorrects = qs.filter(q => answers[q.id] !== q.correctAnswer);
                    const existingWrongIds = new Set((userToUpdate.incorrectQuestions || []).map(q=>q.id));
                    const newWrongs = incorrects.filter(q => !existingWrongIds.has(q.id));
                    userToUpdate.incorrectQuestions = [...(userToUpdate.incorrectQuestions || []), ...newWrongs];
                }

                await setDoc(getDocRef('users', userToUpdate.id), userToUpdate);
                setCurrentUser(userToUpdate); 
            }
            setCurrentPage('results');
        };

        // --- Renderers ---

        if (!dbReady) return (
            <div className="min-h-screen flex items-center justify-center">
                <div className="w-12 h-12 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
            </div>
        );

        const renderLogin = () => (
            <div className="min-h-screen flex items-center justify-center p-4">
                <div className="glass-panel p-8 md:p-12 rounded-[2rem] w-full max-w-md animate-fade-in text-center relative z-10">
                    <div className="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
                        <span className="text-4xl text-primary">🎓</span>
                    </div>
                    <h2 className="text-3xl font-extrabold mb-2">{currentPage === 'register' ? 'إنشاء حساب جديد' : 'منصة الاختبارات'}</h2>
                    <p className="text-sm text-slate-500 dark:text-slate-400 mb-8">{currentPage === 'register' ? 'قم بإدخال بياناتك للبدء' : 'سجل دخولك للمتابعة'}</p>
                    
                    {authError && <div className="bg-danger/10 text-danger p-3 rounded-xl mb-6 text-sm font-bold">{authError}</div>}
                    
                    <div className="space-y-4 text-right">
                        <div>
                            <label className="block text-xs font-bold mb-2 opacity-70">اسم المستخدم</label>
                            <input type="text" value={authUsername} onChange={e=>setAuthUsername(e.target.value)} className="glass-input w-full p-4 rounded-xl font-medium text-left" dir="ltr" placeholder="Username" />
                        </div>
                        <div>
                            <label className="block text-xs font-bold mb-2 opacity-70">كلمة المرور</label>
                            <input type="password" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} className="glass-input w-full p-4 rounded-xl font-medium text-left" dir="ltr" placeholder="Password" />
                        </div>
                        <button onClick={() => handleAuth(currentPage === 'register')} className="glass-btn-primary w-full py-4 rounded-xl font-bold text-lg mt-2">
                            {currentPage === 'register' ? 'تسجيل كطالب' : 'دخول'}
                        </button>
                    </div>
                    
                    <div className="mt-8 pt-6 border-t border-slate-200 dark:border-slate-700">
                        {currentPage === 'login' ? (
                            <button onClick={()=> {setCurrentPage('register'); setAuthError('');}} className="text-primary font-bold text-sm hover:underline">مستخدم جديد؟ إنشاء حساب</button>
                        ) : (
                            <button onClick={()=> {setCurrentPage('login'); setAuthError('');}} className="text-slate-500 font-bold text-sm hover:underline">لدي حساب بالفعل</button>
                        )}
                    </div>
                </div>
            </div>
        );

        const renderProfileSetup = () => (
            <div className="min-h-screen flex items-center justify-center p-4">
                <div className="glass-panel p-8 rounded-[2rem] w-full max-w-md animate-fade-in text-center">
                    <h2 className="text-2xl font-bold mb-6">إعداد الملف الشخصي</h2>
                    <p className="text-sm opacity-70 mb-8">يرجى تحديد التصنيف والمستوى الدراسي لعرض الاختبارات المناسبة لك.</p>
                    
                    <div className="space-y-5 text-right mb-8">
                        <div>
                            <label className="block text-xs font-bold mb-2 opacity-70">الفرقة / التصنيف</label>
                            <select value={setupCategory} onChange={e=>{setSetupCategory(e.target.value); setSetupLevel('');}} className="glass-input w-full p-3 rounded-xl font-medium">
                                <option value="">-- اختر التصنيف --</option>
                                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold mb-2 opacity-70">المستوى الدراسي</label>
                            <select value={setupLevel} onChange={e=>setSetupLevel(e.target.value)} disabled={!setupCategory} className="glass-input w-full p-3 rounded-xl font-medium">
                                <option value="">-- اختر المستوى --</option>
                                {levels.filter(l=>l.categoryId === setupCategory).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}
                            </select>
                        </div>
                    </div>
                    
                    <button onClick={handleProfileSetup} className="glass-btn-primary w-full py-4 rounded-xl font-bold">حفظ ومتابعة</button>
                </div>
            </div>
        );

        // --- Teacher Views ---
        const renderTestBuilder = () => (
            <div className="glass-panel p-6 md:p-8 rounded-[2rem] animate-fade-in">
                <div className="flex justify-between items-center mb-8">
                    <h2 className="text-2xl font-bold">{editingTestId ? 'تعديل الاختبار' : 'اختبار جديد'}</h2>
                    <button onClick={resetTestForm} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded-lg text-sm font-bold">إلغاء الرجوع</button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                    <div>
                        <label className="block text-xs font-bold mb-2 opacity-70">عنوان الاختبار</label>
                        <input type="text" value={newTestTitle} onChange={e=>setNewTestTitle(e.target.value)} className="glass-input w-full p-3 rounded-xl" placeholder="مثال: اختبار الشهر الأول"/>
                    </div>
                    <div>
                        <label className="block text-xs font-bold mb-2 opacity-70">المدة (دقائق)</label>
                        <input type="number" value={newTestDuration} onChange={e=>setNewTestDuration(e.target.value)} className="glass-input w-full p-3 rounded-xl" placeholder="60"/>
                    </div>
                    <div>
                        <label className="block text-xs font-bold mb-2 opacity-70">التصنيف</label>
                        <select value={newTestCategory} onChange={e=>{setNewTestCategory(e.target.value); setNewTestLevel('');}} className="glass-input w-full p-3 rounded-xl">
                            <option value="">-- اختر --</option>
                            {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                        </select>
                    </div>
                    <div>
                        <label className="block text-xs font-bold mb-2 opacity-70">المستوى</label>
                        <select value={newTestLevel} onChange={e=>setNewTestLevel(e.target.value)} className="glass-input w-full p-3 rounded-xl">
                            <option value="">-- اختر --</option>
                            {levels.filter(l=>l.categoryId === newTestCategory).map(l=><option key={l.id} value={l.id}>{l.name}</option>)}
                        </select>
                    </div>
                </div>

                <div className="space-y-6">
                    {newTestQuestions.map((q, qIndex) => (
                        <div key={q.id} className="bg-white/50 dark:bg-slate-800/50 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 relative">
                            <div className="flex justify-between items-center mb-4">
                                <h4 className="font-bold text-primary">سؤال {qIndex + 1}</h4>
                                <button onClick={() => setNewTestQuestions(newTestQuestions.filter((_,i)=>i!==qIndex))} className="text-danger bg-danger/10 px-3 py-1 rounded-lg text-sm font-bold">حذف السؤال</button>
                            </div>
                            
                            <textarea value={q.text} onChange={e => { let qs=[...newTestQuestions]; qs[qIndex].text=e.target.value; setNewTestQuestions(qs); }} placeholder="نص السؤال (يدعم $ للرياضيات والعربية/الإنجليزية)" className="glass-input w-full p-4 rounded-xl mb-3 min-h-[100px] rtl:text-right ltr:text-left" dir="auto"></textarea>
                            <input type="text" value={q.imageUrl} onChange={e => { let qs=[...newTestQuestions]; qs[qIndex].imageUrl=e.target.value; setNewTestQuestions(qs); }} placeholder="رابط صورة للسؤال (اختياري URL)" className="glass-input w-full p-3 rounded-xl mb-6 text-sm" dir="ltr" />
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {q.options.map((opt, oIndex) => (
                                    <div key={opt.id} className={`p-3 rounded-xl border-2 flex flex-col gap-2 transition ${q.correctAnswer === opt.id ? 'border-success bg-success/5' : 'border-slate-200 dark:border-slate-700'}`}>
                                        <div className="flex items-center gap-2">
                                            <input type="radio" name={`correct-${q.id}`} checked={q.correctAnswer === opt.id} onChange={() => { let qs=[...newTestQuestions]; qs[qIndex].correctAnswer=opt.id; setNewTestQuestions(qs); }} className="w-5 h-5 accent-success"/>
                                            <span className="font-bold text-sm opacity-70">خيار صحيح</span>
                                        </div>
                                        <input type="text" value={opt.text} onChange={e => { let qs=[...newTestQuestions]; qs[qIndex].options[oIndex].text=e.target.value; setNewTestQuestions(qs); }} placeholder="نص الإجابة" className="glass-input w-full p-2 rounded-lg text-sm" dir="auto" />
                                        <input type="text" value={opt.imageUrl} onChange={e => { let qs=[...newTestQuestions]; qs[qIndex].options[oIndex].imageUrl=e.target.value; setNewTestQuestions(qs); }} placeholder="رابط صورة (اختياري)" className="glass-input w-full p-2 rounded-lg text-xs" dir="ltr" />
                                    </div>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>

                <div className="mt-6 flex flex-col sm:flex-row gap-4">
                    <button onClick={() => setNewTestQuestions([...newTestQuestions, createNewQuestion()])} className="border-2 border-dashed border-primary text-primary font-bold py-4 rounded-xl w-full hover:bg-primary/5 transition">
                        + إضافة سؤال
                    </button>
                    <button onClick={saveTest} className="glass-btn-primary py-4 px-8 rounded-xl font-bold w-full sm:w-auto whitespace-nowrap">
                        حفظ الاختبار
                    </button>
                </div>
            </div>
        );

        const renderAdminSettings = () => (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-fade-in">
                <div className="glass-panel p-6 rounded-[2rem]">
                    <h3 className="text-xl font-bold mb-6 text-primary flex items-center gap-2"><span className="text-2xl">📂</span> إدارة التصنيفات</h3>
                    <div className="flex gap-2 mb-6">
                        <input type="text" value={newCategoryName} onChange={e=>setNewCategoryName(e.target.value)} placeholder="اسم التصنيف (مثال: الصف الأول)" className="glass-input flex-grow p-3 rounded-xl font-medium" />
                        <button onClick={addCategory} className="bg-primary text-white px-6 py-3 rounded-xl font-bold hover:opacity-90">إضافة</button>
                    </div>
                    <ul className="space-y-2">
                        {categories.map(c => (
                            <li key={c.id} className="flex justify-between items-center p-3 bg-white/40 dark:bg-slate-800/40 rounded-xl">
                                <span className="font-bold">{c.name}</span>
                                <button onClick={()=>deleteCategory(c.id)} className="text-danger text-sm font-bold bg-danger/10 px-3 py-1 rounded-lg">حذف</button>
                            </li>
                        ))}
                        {categories.length===0 && <p className="text-sm opacity-50 text-center py-4">لا توجد تصنيفات</p>}
                    </ul>
                </div>

                <div className="glass-panel p-6 rounded-[2rem]">
                    <h3 className="text-xl font-bold mb-6 text-primary flex items-center gap-2"><span className="text-2xl">🏷️</span> إدارة المستويات</h3>
                    <div className="space-y-3 mb-6">
                        <select value={selectedCategoryForLevel} onChange={e=>setSelectedCategoryForLevel(e.target.value)} className="glass-input w-full p-3 rounded-xl">
                            <option value="">-- اختر التصنيف أولاً --</option>
                            {categories.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                        </select>
                        <div className="flex gap-2">
                            <input type="text" value={newLevelName} onChange={e=>setNewLevelName(e.target.value)} placeholder="المستوى (مثال: الوحدة الأولى)" className="glass-input flex-grow p-3 rounded-xl font-medium" />
                            <button onClick={addLevel} className="bg-primary text-white px-6 py-3 rounded-xl font-bold hover:opacity-90">إضافة</button>
                        </div>
                    </div>
                    <ul className="space-y-2">
                        {levels.map(l => (
                            <li key={l.id} className="flex justify-between items-center p-3 bg-white/40 dark:bg-slate-800/40 rounded-xl">
                                <div><span className="font-bold">{l.name}</span> <span className="text-xs opacity-50 ml-2">({categories.find(c=>c.id===l.categoryId)?.name})</span></div>
                                <button onClick={()=>deleteLevel(l.id)} className="text-danger text-sm font-bold bg-danger/10 px-3 py-1 rounded-lg">حذف</button>
                            </li>
                        ))}
                    </ul>
                </div>

                <div className="glass-panel p-6 rounded-[2rem] md:col-span-2">
                    <h3 className="text-xl font-bold mb-6 text-primary flex items-center gap-2"><span className="text-2xl">💾</span> النسخ الاحتياطي (JSON)</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div className="p-5 border border-dashed border-primary/40 rounded-2xl bg-primary/5">
                            <h4 className="font-bold mb-4">بيانات الاختبارات والأسئلة</h4>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={()=>exportJSON(tests, 'exams_backup.json')} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1">تصدير (تحميل)</button>
                                <label className="bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold cursor-pointer flex-1 text-center">
                                    استيراد (رفع)
                                    <input type="file" accept=".json" onChange={(e)=>importJSON(e, 'tests')} className="hidden" />
                                </label>
                            </div>
                        </div>
                        <div className="p-5 border border-dashed border-success/40 rounded-2xl bg-success/5">
                            <h4 className="font-bold mb-4">بيانات الطلاب</h4>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={()=>exportJSON(users, 'users_backup.json')} className="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-bold flex-1">تصدير (تحميل)</button>
                                <label className="bg-success text-white px-4 py-2 rounded-lg text-sm font-bold cursor-pointer flex-1 text-center">
                                    استيراد (رفع)
                                    <input type="file" accept=".json" onChange={(e)=>importJSON(e, 'users')} className="hidden" />
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const renderAdminDashboard = () => (
            <div className="min-h-screen p-4 md:p-8">
                <div className="max-w-7xl mx-auto space-y-6">
                    {/* Header */}
                    <div className="glass-panel p-5 rounded-3xl flex flex-col md:flex-row justify-between items-center gap-4 relative z-50">
                        <div className="flex items-center gap-4">
                            <div className="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg overflow-hidden border border-white/30 dark:border-slate-600/50 p-0.5 bg-gradient-to-br from-secondary to-primary">
    <img 
        src="https://fv5-3.files.fm/thumb_show.php?i=acw4dnb8bh&view&v=1&PHPSESSID=560b994da82cde537ba52e6fb9207f9946cb4ec2" 
        alt="أيقونة المطور" 
        className="w-full h-full object-cover rounded-[0.6rem]" 
    />
</div>
                            <div>
                                <h1 className="text-xl font-bold">Mr.Ahmed Anees</h1>
                                <p className="text-sm opacity-70">أهلاً بك، {currentUser.username}</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-3">
                            <div className="bg-black/5 dark:bg-white/5 p-1 rounded-xl flex">
                                <button onClick={()=>setDevPage('dashboard')} className={`px-4 py-2 rounded-lg text-sm font-bold transition ${devPage==='dashboard'?'bg-white dark:bg-slate-800 shadow':''}`}>الاختبارات</button>
                                <button onClick={()=>setDevPage('users')} className={`px-4 py-2 rounded-lg text-sm font-bold transition ${devPage==='users'?'bg-white dark:bg-slate-800 shadow':''}`}>الطلاب</button>
                                <button onClick={()=>setDevPage('settings')} className={`px-4 py-2 rounded-lg text-sm font-bold transition ${devPage==='settings'?'bg-white dark:bg-slate-800 shadow':''}`}>الإعدادات</button>
                            </div>
                            <SettingsDropdown darkMode={darkMode} setDarkMode={setDarkMode} handleLogout={handleLogout} />
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="relative z-10">
                        {devPage === 'settings' && renderAdminSettings()}
                        
                        {devPage === 'users' && (
                            <div className="glass-panel p-6 rounded-[2rem] overflow-x-auto animate-fade-in">
                                <h2 className="text-2xl font-bold mb-6">إدارة الطلاب</h2>
                                <table className="w-full text-right text-sm whitespace-nowrap">
                                    <thead className="border-b border-slate-200 dark:border-slate-700 opacity-70">
                                        <tr>
                                            <th className="p-4 font-bold">اسم الطالب</th>
                                            <th className="p-4 font-bold">التصنيف</th>
                                            <th className="p-4 font-bold">المستوى</th>
                                            <th className="p-4 font-bold text-center">الإجراءات</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                        {users.filter(u=>u.role==='student').map(u => (
                                            <tr key={u.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition">
                                                <td className="p-4 font-bold">{u.username}</td>
                                                <td className="p-4">{categories.find(c=>c.id===u.category)?.name || '-'}</td>
                                                <td className="p-4">{levels.find(l=>l.id===u.level)?.name || '-'}</td>
                                                <td className="p-4 text-center space-x-2 space-x-reverse flex justify-center">
                                                    <button onClick={()=>resetAttempts(u)} className="bg-warning/10 text-warning px-3 py-1.5 rounded-lg font-bold text-xs hover:bg-warning hover:text-white transition">تجديد المحاولات</button>
                                                    <button onClick={()=>deleteUser(u.id)} className="bg-danger/10 text-danger px-3 py-1.5 rounded-lg font-bold text-xs hover:bg-danger hover:text-white transition">حذف</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}

                        {devPage === 'dashboard' && (
                            showCreateTestForm ? renderTestBuilder() : (
                                <div className="space-y-6 animate-fade-in">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-2xl font-bold">بنك الاختبارات</h2>
                                        <button onClick={()=>{resetTestForm(); setShowCreateTestForm(true);}} className="glass-btn-primary px-6 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg">
                                            <span>+</span> إنشاء اختبار جديد
                                        </button>
                                    </div>

                                    {/* Tabs */}
                                    <div className="flex overflow-x-auto gap-2 pb-2">
                                        {categories.map(c => (
                                            <button key={c.id} onClick={()=>setActiveCategoryTab(c.id)} className={`px-6 py-3 rounded-xl font-bold whitespace-nowrap transition ${activeCategoryTab === c.id ? 'bg-primary text-white shadow-md' : 'glass-panel hover:bg-white dark:hover:bg-slate-800 opacity-70'}`}>
                                                {c.name}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Tests Grid */}
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                                        {tests.filter(t=>t.categoryId === activeCategoryTab).map(t => (
                                            <div key={t.id} className="glass-panel p-6 rounded-3xl glass-card-hover flex flex-col">
                                                <div className="flex justify-between items-start mb-4">
                                                    <h3 className="font-bold text-lg leading-tight">{t.title}</h3>
                                                    <span className="bg-slate-100 dark:bg-slate-800 text-xs px-2 py-1 rounded font-bold">{levels.find(l=>l.id===t.levelId)?.name}</span>
                                                </div>
                                                <div className="space-y-2 mb-6 text-sm opacity-80 font-medium">
                                                    <p>الأسئلة: {t.questions?.length}</p>
                                                    <p>المدة: {t.duration} دقيقة</p>
                                                    <p>المحاولات المسموحة: {t.maxAttempts}</p>
                                                </div>
                                                <div className="mt-auto flex gap-2">
                                                    <button onClick={()=>{
                                                        setEditingTestId(t.id); setNewTestTitle(t.title); setNewTestCategory(t.categoryId); 
                                                        setNewTestLevel(t.levelId); setNewTestDuration(t.duration); setNewTestMaxAttempts(t.maxAttempts); 
                                                        setNewTestQuestions(t.questions); setShowCreateTestForm(true);
                                                    }} className="flex-1 bg-warning/20 text-warning py-2.5 rounded-xl font-bold text-sm hover:bg-warning hover:text-white transition">تعديل</button>
                                                    <button onClick={()=>deleteTest(t.id)} className="flex-1 bg-danger/10 text-danger py-2.5 rounded-xl font-bold text-sm hover:bg-danger hover:text-white transition">حذف</button>
                                                </div>
                                            </div>
                                        ))}
                                        {tests.filter(t=>t.categoryId === activeCategoryTab).length === 0 && (
                                            <div className="col-span-full py-12 text-center opacity-50 border-2 border-dashed rounded-3xl">لا توجد اختبارات في هذا التصنيف</div>
                                        )}
                                    </div>
                                </div>
                            )
                        )}
                    </div>
                </div>
            </div>
        );

        // --- Student Views ---
        const renderStudentDashboard = () => {
            const myTests = tests.filter(t => t.categoryId === currentUser.category && t.levelId === currentUser.level);
            
            return (
                <div className="min-h-screen p-4 md:p-8 animate-fade-in relative">
                    <div className="max-w-7xl mx-auto space-y-6">
                        {/* Header */}
                        <div className="glass-panel p-6 rounded-[2rem] flex justify-between items-center relative z-50">
                            <div className="flex items-center gap-4">
                                <div className="w-14 h-14 bg-gradient-to-br from-primary to-blue-300 rounded-2xl flex items-center justify-center text-2xl shadow-lg">👋</div>
                                <div>
                                    <h1 className="text-2xl font-extrabold">{currentUser.username}</h1>
                                    <p className="text-sm font-semibold text-primary">{categories.find(c=>c.id===currentUser.category)?.name} - {levels.find(l=>l.id===currentUser.level)?.name}</p>
                                </div>
                            </div>
                            <SettingsDropdown darkMode={darkMode} setDarkMode={setDarkMode} handleLogout={handleLogout} />
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-4 gap-6 relative z-10">
                            {/* Main Content: Tests */}
                            <div className="lg:col-span-3 space-y-6">
                                <h2 className="text-xl font-bold flex items-center gap-2 px-2"><span className="text-primary">📝</span> الاختبارات المقررة عليك</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {myTests.map(test => {
                                        const attemptsLeft = currentUser.attemptsLeft[test.id] !== undefined ? currentUser.attemptsLeft[test.id] : test.maxAttempts;
                                        const isLocked = attemptsLeft <= 0;
                                        
                                        return (
                                            <div key={test.id} className="glass-panel p-6 rounded-3xl relative overflow-hidden glass-card-hover flex flex-col">
                                                {isLocked && <div className="absolute top-4 left-4 bg-danger text-white text-xs font-bold px-3 py-1 rounded-lg z-10 shadow">مغلق</div>}
                                                <h3 className="font-extrabold text-xl mb-3 pr-2 border-r-4 border-primary">{test.title}</h3>
                                                <div className="bg-slate-100 dark:bg-slate-800/50 p-4 rounded-2xl space-y-2 mb-6">
                                                    <div className="flex justify-between text-sm font-semibold opacity-80"><span>عدد الأسئلة:</span><span>{test.questions.length}</span></div>
                                                    <div className="flex justify-between text-sm font-semibold opacity-80"><span>زمن الاختبار:</span><span>{test.duration} دقيقة</span></div>
                                                    <div className="flex justify-between text-sm font-semibold opacity-80"><span>المحاولات المتبقية:</span><span className={attemptsLeft===0?'text-danger':''}>{attemptsLeft} من {test.maxAttempts}</span></div>
                                                </div>
                                                <button onClick={()=>startExam(test.id)} disabled={isLocked} className={`w-full py-4 rounded-xl font-bold mt-auto ${isLocked ? 'bg-slate-200 dark:bg-slate-700 text-slate-400 cursor-not-allowed' : 'glass-btn-primary shadow-lg'}`}>
                                                    {isLocked ? 'استنفدت المحاولات' : 'بدء الاختبار الآن'}
                                                </button>
                                            </div>
                                        )
                                    })}
                                    {myTests.length === 0 && (
                                        <div className="col-span-full glass-panel p-10 rounded-3xl text-center opacity-60 font-bold text-lg">لا توجد اختبارات متاحة لك حالياً في هذا المستوى.</div>
                                    )}
                                </div>
                            </div>

                            {/* Sidebar: Weak Points */}
                            <div className="lg:col-span-1">
                                <div className="glass-panel p-6 rounded-3xl h-full flex flex-col">
                                    <h3 className="text-lg font-bold mb-6 flex items-center gap-2 text-warning"><span className="text-2xl">🎯</span> نقاط الضعف</h3>
                                    <p className="text-xs opacity-70 mb-4 font-semibold">أسئلة أخطأت بها سابقاً للمراجعة</p>
                                    <div className="space-y-4 overflow-y-auto flex-grow max-h-[500px] pr-2 custom-scrollbar">
                                        {currentUser.incorrectQuestions && currentUser.incorrectQuestions.length > 0 ? (
                                            currentUser.incorrectQuestions.map((q, idx) => (
                                                <div key={idx} className="bg-danger/5 border border-danger/20 p-4 rounded-2xl">
                                                    <p className="text-sm font-bold mb-3"><MathComponent text={q.text} /></p>
                                                    <div className="bg-success/10 text-success text-xs p-2 rounded-lg font-bold">
                                                        الإجابة الصحيحة: <MathComponent text={q.options.find(o=>o.id===q.correctAnswer)?.text || 'صورة'} />
                                                    </div>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="text-center opacity-50 py-10 font-bold text-sm">ممتاز! لا توجد نقاط ضعف مسجلة حتى الآن.</div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const renderTestRunner = () => {
            if (!selectedTest) return null;
            const qs = selectedTest.questions;
            const q = qs[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / qs.length) * 100;

            return (
                <div className="min-h-screen bg-backgroundLight dark:bg-backgroundDark flex flex-col fixed inset-0 z-[99999] overflow-y-auto">
                    {/* Header bar fixed */}
                    <div className="sticky top-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-b border-slate-200 dark:border-slate-800 p-4 flex justify-between items-center z-50">
                        <div>
                            <h2 className="font-black text-xl">{selectedTest.title}</h2>
                            <p className="text-xs font-bold text-danger animate-pulse">تنبيه: الخروج من ملء الشاشة يلغي الاختبار</p>
                        </div>
                        <div className="bg-primary/10 border border-primary/20 text-primary px-4 py-2 rounded-xl font-black text-xl flex items-center gap-2 font-mono">
                            ⏳ {Math.floor(timer/60).toString().padStart(2,'0')}:{(timer%60).toString().padStart(2,'0')}
                        </div>
                    </div>
                    
                    {/* Progress */}
                    <div className="h-1.5 bg-slate-200 dark:bg-slate-800 w-full"><div className="h-full bg-primary transition-all duration-300" style={{width: `${progress}%`}}></div></div>

                    {/* Question Content */}
                    <div className="flex-grow p-4 md:p-8 flex flex-col items-center justify-center max-w-4xl mx-auto w-full">
                        <div className="w-full mb-8 text-center">
                            <span className="inline-block bg-slate-200 dark:bg-slate-800 px-4 py-1 rounded-full text-sm font-bold opacity-70 mb-6">سؤال {currentQuestionIndex + 1} من {qs.length}</span>
                            {q.imageUrl && <img src={q.imageUrl} className="max-h-64 object-contain mx-auto mb-6 rounded-2xl shadow border border-slate-200 dark:border-slate-700" alt="سؤال" />}
                            <h3 className="text-2xl md:text-3xl font-bold leading-relaxed"><MathComponent text={q.text} /></h3>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                            {q.options.map((opt) => {
                                const isSelected = answers[q.id] === opt.id;
                                return (
                                    <button key={opt.id} onClick={()=>setAnswers({...answers, [q.id]: opt.id})} className={`p-5 rounded-2xl border-2 text-right transition-all flex items-center gap-4 ${isSelected ? 'border-primary bg-primary/5 shadow-md scale-[1.01]' : 'border-slate-200 dark:border-slate-700 hover:border-primary/40 bg-white/50 dark:bg-slate-800/50'}`}>
                                        <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${isSelected ? 'border-primary bg-primary' : 'border-slate-300'}`}>
                                            {isSelected && <div className="w-2.5 h-2.5 bg-white rounded-full"></div>}
                                        </div>
                                        <div className="font-bold text-lg flex-grow">
                                            {opt.imageUrl && <img src={opt.imageUrl} className="h-20 mb-2 rounded-lg border border-slate-200" alt="خيار" />}
                                            <MathComponent text={opt.text} />
                                        </div>
                                    </button>
                                )
                            })}
                        </div>
                    </div>

                    {/* Footer bar */}
                    <div className="sticky bottom-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 p-4 flex justify-between items-center mt-auto z-50">
                        <button onClick={()=>setCurrentQuestionIndex(Math.max(0, currentQuestionIndex-1))} disabled={currentQuestionIndex===0} className="px-6 py-3 rounded-xl font-bold bg-slate-200 dark:bg-slate-800 disabled:opacity-30 transition">السابق</button>
                        {currentQuestionIndex === qs.length - 1 ? (
                            <button onClick={()=>handleSubmitTest(false)} className="px-8 py-3 bg-success text-white rounded-xl font-bold shadow-lg hover:shadow-success/50 transition transform hover:-translate-y-1">تسليم الاختبار</button>
                        ) : (
                            <button onClick={()=>setCurrentQuestionIndex(currentQuestionIndex+1)} className="glass-btn-primary px-8 py-3 rounded-xl font-bold">التالي</button>
                        )}
                    </div>
                </div>
            )
        };

        const renderResults = () => {
            const qs = selectedTest.questions;
            const score = isExamCancelled ? 0 : qs.filter(q => answers[q.id] === q.correctAnswer).length;
            const isPass = score >= (qs.length / 2) && !isExamCancelled;

            return (
                 <div className="min-h-screen flex items-center justify-center p-4">
                     <div className="glass-panel p-10 md:p-14 rounded-[3rem] text-center max-w-lg w-full animate-fade-in shadow-2xl">
                         {isExamCancelled ? (
                             <div className="w-24 h-24 mx-auto rounded-full bg-danger text-white flex items-center justify-center text-4xl mb-6 shadow-lg shadow-danger/40 animate-bounce">⚠️</div>
                         ) : (
                             <div className={`w-24 h-24 mx-auto rounded-full flex items-center justify-center text-5xl mb-6 shadow-lg ${isPass ? 'bg-success text-white shadow-success/40' : 'bg-warning text-white shadow-warning/40'}`}>
                                 {isPass ? '🏆' : '📚'}
                             </div>
                         )}
                         
                         <h2 className="text-3xl md:text-4xl font-black mb-2">{isExamCancelled ? 'تم إلغاء الاختبار!' : 'انتهى الاختبار'}</h2>
                         <p className="opacity-70 font-medium mb-8">{isExamCancelled ? 'لقد قمت بالخروج من وضع ملء الشاشة' : `اختبار: ${selectedTest.title}`}</p>
                         
                         <div className="bg-slate-100 dark:bg-slate-800/50 rounded-3xl p-8 mb-8">
                             <p className="text-sm font-bold uppercase opacity-60 mb-2">نتيجتك النهائية</p>
                             <div className="flex justify-center items-baseline gap-2" dir="ltr">
                                <span className="text-3xl font-bold opacity-40">/ {qs.length}</span>
                                <p className={`text-7xl font-black ${isExamCancelled ? 'text-danger' : (isPass ? 'text-success' : 'text-warning')}`}>{score}</p>
                             </div>
                         </div>

                         <button onClick={()=>{setCurrentPage('dashboard'); setIsExamCancelled(false);}} className="glass-btn-primary w-full py-4 rounded-xl text-lg font-bold shadow-xl">العودة للوحة القيادة</button>
                     </div>
                 </div>
            )
        };

        // Router
        switch (currentPage) {
            case 'login': case 'register': return renderLogin();
            case 'profileSetup': return renderProfileSetup();
            case 'dashboard': return currentUser.role === 'student' ? renderStudentDashboard() : renderAdminDashboard();
            case 'test': return renderTestRunner();
            case 'results': return renderResults();
            default: return renderLogin();
        }
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
